# Apps published in this F-Droid repo.
#
# Each entry pulls signed APKs from a GitHub repo's Releases.
#   repo:       owner/name of the GitHub repo (required)
#   asset:      regex the APK file name must match (default: '\.apk$')
#   keep:       how many of the newest releases to publish (default: 1)
#   prerelease: also take pre-releases (default: false)
#
# The source repos (parla, kleinanzeigen-alarm, jiggolo) are private and the
# workflow token cannot read them, so their APKs are mirrored as releases of
# this repo by scripts/mirror_releases.sh (run on a machine logged in with gh).
# Once a SOURCE_TOKEN secret exists, these can point at the source repos again.

apps:
  - repo: ashleyiscookin/fdroid
    asset: '^parla-.*\.apk$'
  - repo: ashleyiscookin/fdroid
    asset: '^kleinanzeigen-alarm-.*\.apk$'
  - repo: ashleyiscookin/fdroid
    asset: '^raope\.apk$'
